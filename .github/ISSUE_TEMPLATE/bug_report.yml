name: Bug 报告
description: 桌宠显示异常、点击无反应、设置开关不生效等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量把下面填完整，尤其是版本与复现步骤。
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本
      description: 应用「关于」里可以看到，或者窗口标题
      placeholder: 例如 0.2.1-rc.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: 例如 Windows 11 24H2 / macOS 15.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的部分
      options:
        - 桌宠（显示 / 拖拽 / 表情）
        - 右下角立牌（气泡 / 点击 / 余额）
        - 聊天皮肤（壁纸 / 液态玻璃）
        - 设置里的主题开关
        - 安装 / 启动报错
        - 其它
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 DSH
        2. 发送一条消息
        3. 点击右下角立牌
        4. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 浏览器控制台里 `JSON.stringify(window.__petDebug)` 的输出很有帮助
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经重启过 DSH 并重试
          required: true
        - label: 我搜索过已有 issue，没有重复
          required: true
